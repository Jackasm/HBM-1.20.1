modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Jackasm/HbmNuclearTech-1.20.1/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "logo.png"
authors = "${mod_authors}, original by Dr. Hbm"
credits = "Original mod by the HBM team: Alcater, Drillgon200 and contributors."
description = '''
An unofficial port of HBM's Nuclear Tech Mod to Minecraft 1.20.1.
Keeps the original gameplay: nuclear industry, radiation, weapons, world structures.
'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
